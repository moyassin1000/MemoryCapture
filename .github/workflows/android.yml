name: Android CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Prepare stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 -d .github/memorycapture-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Lint
        run: gradle lint --stacktrace
      - name: Unit tests
        run: gradle test --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoryCapture-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
